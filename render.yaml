databases:
  - name: python_heroku_task_db
    plan: free
    databaseName: python_heroku_task
    user: python_heroku_task

services:
  - type: web
    name: python-heroku-task
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn python_heroku_task.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DATABASE_URL
        fromDatabase:
          name: python_heroku_task_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: 4
